<!-- tag doctype é a tag inicial -->
<!doctype html>
<!-- tag html é a tag onde temos a definição -->
<!-- obs é o navegador que esta tag e pergunta se queremos mudar idioma -->
<html lang="en">
<!-- head é a tag de cabeça do HTML -->
<head>
  <!-- faz a configuração do idioma com acentos na pagina HTML -->
  <meta charset="utf-8">
  <title>Aula0102</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- A tag link é a mais usada para instaalção de fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<!-- Body é onde fica o corpo da aplicaçaõ ou da pagina em HTML -->
<body>
  <!-- a tag app-root é a tag Pai ou Mãe do Angular ou seja é a 1ª -->
  <app-root></app-root>
</body>
</html>
